<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav>
    <a href="phishing.html">Link analyzer</a>
    <a href="password.html" aria-current="page">Password checker</a>
  </nav>
  <h1>Password strength checker</h1>
  <p class="sub">Test a password, check if it has leaked, or generate a strong one.</p>

  <section class="card">
    <label for="pw" class="note">Password to test</label>
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="toggle" class="alt">Show</button>
    <button id="breach">Check for leaks</button>
    <div class="meter"><i id="bar"></i></div>
    <p id="verdict" class="verdict"></p>
    <p id="crack" class="note"></p>
    <ul id="tips"></ul>
    <p id="leak" class="note" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>Password generator</h2>
    <label for="len" class="note">Length: <span id="lenv">16</span></label>
    <input id="len" type="range" min="8" max="32" value="16">
    <div id="out" class="gen" aria-live="polite"></div>
    <button id="gen">Generate</button>
    <button id="copy" class="alt">Copy</button>
  </section>

  <p class="note">Everything runs in your browser. The leak check sends only the first 5 characters of a hash, never your password.</p>
</main>
<script src="password.js"></script>
</body>
</html>
